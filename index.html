<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABO LIFE｜第二性別人生</title><style>
:root{--bg:#10121e;--panel:#1d2032;--line:#383b56;--pink:#f0a6c4;--txt:#f7f1fa;--muted:#b9b4c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#3b2947,#10121e 65%);color:var(--txt);font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:850px;margin:auto;padding:16px 16px 60px;min-height:100vh}header{text-align:center;padding:20px 0 12px}h1{font-size:clamp(30px,7vw,53px);letter-spacing:3px;margin:8px 0;color:#ffd2e5}h2{color:#ffd2e5;margin:0 0 15px}p{line-height:1.8;color:var(--muted)}.tag{letter-spacing:3px;color:var(--pink)}.card{background:#1d2032ee;border:1px solid var(--line);border-radius:19px;padding:22px;margin:16px 0;box-shadow:0 10px 35px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px}.btn{border:1px solid #5b4a68;border-radius:13px;padding:15px 12px;background:#312b44;color:white;cursor:pointer;font-size:15px;text-align:left;min-height:55px}.btn:hover{background:#543b5d}.primary{background:#a95d88;border-color:#df92b8;text-align:center;font-weight:bold}.btn:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #5b4a68;border-radius:10px;background:#141625;color:white;padding:12px;font:inherit;margin-top:6px}label{display:block;color:#d8c9dc;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.stat{padding:9px 12px;border-radius:10px;background:#292c40}.hidden{display:none!important}.notice{border-left:3px solid var(--pink);padding:10px 15px;background:#2b263b;margin:12px 0;color:#e7d7e6}.scene{font-size:17px;line-height:2;white-space:pre-line}.small{font-size:13px;color:var(--muted)}.bottom{position:sticky;bottom:0;background:#10121ef0;padding:10px 0;display:flex;gap:8px;overflow-x:auto}.bottom .btn{flex:1;text-align:center;min-width:75px;padding:10px 5px}.bar{height:7px;background:#121522;border-radius:5px;overflow:hidden;margin:5px 0 10px}.fill{height:100%;background:#e89abc}.log{max-height:210px;overflow:auto;font-size:13px;color:#c7c2d5}.pill{display:inline-block;padding:5px 9px;background:#40354b;border-radius:20px;margin:3px}.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 20px}</style></head><body><main><header><div class="tag">✦ INTERACTIVE LIFE SIMULATOR ✦</div><h1>ABO LIFE</h1><div>第二性別人生 · 互動經營模擬器</div></header><section id="app"><div class="card"><h2>🎮 遊戲主選單</h2><p>正在啟動互動遊戲……</p><div class="grid"><button class="btn primary" onclick="menu()">▶ 開始／返回主選單</button><button class="btn" onclick="loadScreen()">💾 讀取存檔</button></div><p class="small">若點擊沒有反應，代表目前的預覽器不支援 JavaScript。請將遊戲發布成網頁後，透過 Safari 開啟。</p></div></section><nav id="nav" class="bottom hidden"></nav></main><script>
const $=x=>document.getElementById(x), app=$('app'),nav=$('nav');const seed={version:'1.0',day:1,minute:480,weather:'晴朗',location:'自宅',money:28000,health:90,energy:85,mood:70,stress:12,skill:15,job:'咖啡廳店員',salary:26000,unread:1,relationships:{'沈予珩':{favor:5,trust:3},'林知夏':{favor:25,trust:20},'周景言':{favor:0,trust:0}},messages:[{from:'林知夏',text:'早安！今天有空一起喝咖啡嗎？',read:false}],inventory:['手機','家門鑰匙','身分證'],events:[],achievements:[],history:[],npc:{},setting:{frequency:'標準',romance:true},difficulty:'標準',player:null};let s=null,step=0;
const clone=x=>JSON.parse(JSON.stringify(x)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function button(label,action,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${action}">${label}</button>`}function page(title,content){app.innerHTML=`<div class="card"><h2>${title}</h2>${content}</div>`}function minutes(){return `${String(Math.floor(s.minute/60)%24).padStart(2,'0')}:${String(s.minute%60).padStart(2,'0')}`}function date(){let d=new Date(2026,10,23+s.day-1);return d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}function advance(n){s.minute+=n;while(s.minute>=1440){s.minute-=1440;s.day++;s.money-=Math.max(0,Math.round(s.difficulty==='極限'?400:180));s.energy=Math.max(0,s.energy-5);s.stress=Math.min(100,s.stress+2);if(s.day%30===0){s.money-=9000;note('月租扣款 NT$9,000')}}s.energy=Math.max(0,Math.min(100,s.energy));s.mood=Math.max(0,Math.min(100,s.mood));s.stress=Math.max(0,Math.min(100,s.stress));}function note(t){s.history.unshift(`[第${s.day}天 ${minutes()}] ${t}`);s.history=s.history.slice(0,100)}function changeMoney(v,why){if(v<0&&s.money+v<0){alert('餘額不足，無法完成交易。');return false}s.money+=v;note(`${why}：${v>=0?'+':''}NT$${v}`);return true}function menu(){s=null;nav.classList.add('hidden');page('🎮 遊戲主選單',`<p>在這座城市，第二性別影響社交與制度，但不決定你的人生。</p><div class="grid">${button('▶ 開始新遊戲','newGame()',true)}${button('💾 讀取存檔','loadScreen()')}${button('⚙️ 遊戲設定','settings(false)')}${button('📖 世界觀介紹','world()')}${button('❓ 遊戲說明','help()')}</div>`)}function world(){page('📖 世界觀',`<p>故事發生於架空現代都市「星川市」。居民具有 Alpha、Beta、Omega 三種第二性別。資訊素與週期會影響部分生活安排；平等就業、隱私與自主同意受法律保障。城市分為住宅區、商業街、中央商圈、醫療區及尚未解鎖的港灣區。</p>${button('← 返回主選單','menu()')}`)}function help(){page('❓ 遊戲說明',`<p>使用畫面按鈕移動、工作、聊天、購物、休息。每個行動都會推進遊戲時間並可能改變金錢、體力、心情與 NPC 關係。NPC 有各自日程，可能拒絕邀約。銀行與事件紀錄會保存實際變動。</p><p>「儲存」可下載 JSON 存檔；重新開啟網頁後可匯入恢復。部分進度也會自動保存在此瀏覽器。</p>${button('← 返回','menu()')}`)}function settings(inGame){page('⚙️ 遊戲設定',`<label>事件頻率<select id="freq"><option>低</option><option selected>標準</option><option>高</option></select></label><label><input id="romance" type="checkbox" checked style="width:auto"> 啟用戀愛事件</label>${button('儲存設定',inGame?'saveSettingsGame()':'menu()',true)} ${button('返回',inGame?'home()':'menu()')}`)}function saveSettingsGame(){s.setting.frequency=$('freq').value;s.setting.romance=$('romance').checked;home()}
function newGame(){step=1;page('STEP 1｜人生題材',`<p>選擇想體驗的人生方向。所有模式都保留開放世界與社交系統。</p><div class="grid">${['都市日常','職場成長','創業經營','戀愛與家庭','自由人生'].map(t=>button(t,`chooseTheme('${t}')`)).join('')}</div>${button('← 主選單','menu()')}`)}let draft={};function chooseTheme(t){draft={theme:t};create()}function create(){page('STEP 2｜創建角色',`<div class="fieldgrid"><label>姓名<input id="name" placeholder="輸入角色姓名"></label><label>年齡<input id="age" type="number" min="18" max="90" value="24"></label><label>性別<select id="gender"><option>女性</option><option>男性</option><option>非二元</option><option>自訂</option></select></label><label>第二性別<select id="abo"><option>Omega</option><option>Alpha</option><option>Beta</option></select></label><label>性格<select id="personality"><option>溫柔內斂</option><option>開朗外向</option><option>理性獨立</option><option>自由隨性</option></select></label><label>家庭背景<select id="family"><option>普通家庭</option><option>單親家庭</option><option>富裕家庭</option><option>獨立生活</option></select></label><label>職業<select id="job"><option>咖啡廳店員</option><option>設計助理</option><option>行政職員</option><option>自由工作者</option><option>待業</option></select></label><label>人生目標<select id="goal"><option>經濟獨立</option><option>事業成功</option><option>建立親密關係</option><option>創業開店</option><option>自由探索</option></select></label><label>外貌描述<input id="appearance" placeholder="髮色、眼睛、穿搭等"></label><label>資訊素氣味<input id="scent" placeholder="例如：白茶、雪松、柑橘"></label></div><p class="small">所有角色皆為成年人。初始資金與能力會依難度調整。</p>${button('🎲 隨機填寫','randomChar()')} ${button('下一步 →','difficulty()',true)}`)}function randomChar(){let names=['許沐晴','蘇晚寧','江以澄','顧念安'];$('name').value=names[Math.floor(Math.random()*names.length)];$('appearance').value='深棕髮、琥珀色眼睛、簡約休閒穿搭';$('scent').value='白茶'}function difficulty(){let age=Number($('age').value);if(age<18||age>90){alert('角色須年滿18歲');return}draft.player={name:$('name').value.trim()||'許沐晴',age,gender:$('gender').value,abo:$('abo').value,personality:$('personality').value,family:$('family').value,job:$('job').value,goal:$('goal').value,appearance:$('appearance').value||'自然清爽的外貌',scent:$('scent').value||'淡淡的花香'};page('STEP 3｜選擇難度',`<div class="grid">${['輕鬆','標準','真實','極限'].map(x=>button(x+'模式',`start('${x}')`)).join('')}</div>${button('← 修改角色','create()')}`)}function start(d){s=clone(seed);s.player=draft.player;s.job=draft.player.job;s.difficulty=d;s.money=({輕鬆:60000,標準:28000,真實:12000,極限:4500})[d];s.salary=({'咖啡廳店員':26000,'設計助理':32000,'行政職員':30000,'自由工作者':0,'待業':0})[s.job];note('新人生開始');home()}
function navShow(){nav.classList.remove('hidden');nav.innerHTML=button('🏠 首頁','home()')+button('🗺️ 地圖','map()')+button('📱 手機','phone()')+button('👥 人際','people()')+button('💾 存檔','saveScreen()')}function stats(){return `<div class="row"><span class="stat">📅 第${s.day}天 ${minutes()}</span><span class="stat">📍 ${esc(s.location)}</span><span class="stat">💰 NT$${s.money.toLocaleString()}</span><span class="stat">⚡ ${s.energy}/100</span><span class="stat">😊 ${s.mood}/100</span></div>`}function home(message){navShow();page('🏠 '+esc(s.player.name)+' 的人生',`${stats()}<p class="small">${date()} · ${s.weather} · ${esc(s.player.abo)} · ${esc(s.job)} · ${esc(s.difficulty)}模式</p><div class="notice">${esc(message||'清晨的城市逐漸甦醒。今天的行程由你決定。')}</div><div class="grid">${button('💼 工作 / 學習','work()')}${button('🗺️ 外出探索','map()')}${button('💬 社交互動','people()')}${button('🛏️ 休息','rest()')}${button('📱 手機','phone()')}${button('📊 詳細狀態','status()')}</div><p class="small">💡 貼心提醒：每 30 個遊戲日會扣除房租 NT$9,000，日常開支會隨時間計算。</p>`)}const places={'自宅':{time:0,cost:0,desc:'你的私人空間，可以休息與整理生活。'},'星月咖啡廳':{time:15,cost:0,desc:'溫暖的街角咖啡廳，上午八點至晚上九點營業。'},'中央商圈':{time:25,cost:35,desc:'商店、餐廳與生活用品集中地。'},'星川公園':{time:12,cost:0,desc:'綠意盎然的公園，適合散步。'},'市立醫療中心':{time:30,cost:40,desc:'提供一般醫療與第二性別健康諮詢。'},'港灣區 🔒':{time:0,cost:0,desc:'尚未解鎖。'}};function map(){navShow();page('🗺️ 星川市地圖',`${stats()}<div class="grid">${Object.entries(places).map(([name,p])=>button(`${name}<br><small>${p.desc}</small>`,`travel('${name}')`)).join('')}</div>`)}function travel(place){if(place.includes('🔒')){alert('尚未解鎖此區域');return}if(place===s.location){locationScene();return}let p=places[place];if(p.cost&&!changeMoney(-p.cost,'交通費'))return;advance(p.time);s.location=place;note('抵達'+place);locationScene()}function locationScene(){navShow();let h=Math.floor(s.minute/60),open=h>=8&&h<21;let actions=s.location==='星月咖啡廳'?(open?button('☕ 購買咖啡 NT$120',"buy(120,'咖啡',8)")+button('👥 看看店裡的人','people()'):'<p>咖啡廳目前未營業。</p>'):s.location==='中央商圈'?button('🛍️ 生活採買 NT$350',"buy(350,'生活用品',15)"):s.location==='星川公園'?button('🌿 散步 30 分鐘','walk()'):s.location==='市立醫療中心'?button('🏥 健康檢查 NT$600','checkup()'):button('🛏️ 休息','rest()');page('📍 '+s.location,`${stats()}<p>${places[s.location].desc}</p><div class="grid">${actions}${button('🗺️ 返回地圖','map()')}${button('🏠 回家',"travel('自宅')")}</div>`)}function buy(price,item,time){if(!changeMoney(-price,'購買'+item))return;advance(time);s.inventory.push(item);s.mood=Math.min(100,s.mood+4);locationScene()}function walk(){advance(30);s.energy-=8;s.mood+=9;s.stress-=5;home('你在公園散步，心情稍微放鬆了。')}function checkup(){if(!changeMoney(-600,'健康檢查'))return;advance(60);s.health=Math.min(100,s.health+12);home('完成例行健康檢查。')}function rest(){navShow();page('🛏️ 休息',`<p>想休息多久？</p><div class="grid">${button('小睡 30 分鐘','sleep(30)')}${button('休息 2 小時','sleep(120)')}${button('睡覺 8 小時','sleep(480)')}${button('返回','home()')}</div>`)}function sleep(n){advance(n);s.energy=Math.min(100,s.energy+Math.round(n/8));s.stress=Math.max(0,s.stress-Math.round(n/24));home('你休息了一段時間，恢復了精神。')}function work(){navShow();let h=Math.floor(s.minute/60),eligible=h>=9&&h<18;page('💼 工作與成長',`${stats()}<p>目前職業：${esc(s.job)}｜月薪 NT$${s.salary.toLocaleString()}</p><p>工作時段：09:00–18:00。每完成一個工作日，月底依出勤比例結算薪資。</p><div class="grid">${button('💼 工作 4 小時',"doWork(240)")}${button('📚 自學 1 小時','study()')}${button('📋 查看職涯','career()')}${button('返回','home()')}</div>${!eligible?'<p class="small">目前不在一般工作時段；工作可能無法進行。</p>':''}`)}function doWork(n){let h=Math.floor(s.minute/60);if(h<9||h>=14||s.job==='待業'){alert('目前不符合工作條件，請在 09:00–14:00 開始上班，或先尋找工作。');return}if(s.energy<25){alert('體力不足，請先休息。');return}advance(n);s.energy-=25;s.stress+=8;s.skill+=2;s.workUnits=(s.workUnits||0)+.5;note('完成半日工作');home('忙碌的工作告一段落。薪資將在結算日發放。')}function study(){if(s.energy<12){alert('體力不足');return}advance(60);s.energy-=12;s.skill+=3;s.mood-=2;home('你完成了一小時的技能練習。')}function career(){page('📋 職涯資訊',`<p>職業：${esc(s.job)}<br>技能：${s.skill}<br>累積半日出勤：${s.workUnits||0}<br>月薪基準：NT$${s.salary}</p><div class="notice">💡 提醒：工作日累積不代表立即入帳。薪資依出勤計算，於每 30 天結算。</div>${button('返回','work()')}`)}
function people(){navShow();let persons=[['沈予珩','29歲 · Alpha · 建築師','工作繁忙，說話謹慎'],['林知夏','25歲 · Beta · 咖啡師','開朗親切的朋友'],['周景言','28歲 · Omega · 醫療研究員','冷靜而有距離感']];page('👥 人際關係',`${stats()}<div class="grid">${persons.map(([n,info,desc])=>button(`${n}<br><small>${info}<br>${desc}<br>好感 ${s.relationships[n].favor}</small>`,`person('${n}')`)).join('')}</div>`)}function person(n){let h=Math.floor(s.minute/60),available=n==='林知夏'?(h>=8&&h<=21):n==='沈予珩'?(h>=18&&h<=22):(h>=12&&h<=20);page('💬 '+n,`${stats()}<p>${available?`${n}現在可以聯絡。`:`${n}目前忙碌或正在休息。`}</p><div class="grid">${button('傳送問候',`chat('${n}')`)}${button('邀請喝咖啡',`invite('${n}')`)}${button('返回','people()')}</div>`)}function chat(n){advance(5);let h=Math.floor(s.minute/60),available=n==='林知夏'?(h>=8&&h<=21):n==='沈予珩'?(h>=18&&h<=22):(h>=12&&h<=20);if(!available){note(n+'暫未回覆');home(`${n}目前沒有回覆訊息。`);return}let r=s.relationships[n];r.favor=Math.min(100,r.favor+2);r.trust=Math.min(100,r.trust+1);s.messages.push({from:n,text:n==='林知夏'?'今天過得怎麼樣？':n==='沈予珩'?'你好，有什麼事嗎？':'你好，我現在有一點時間。',read:false});s.unread++;note('與'+n+'聊天');person(n)}function invite(n){advance(5);let r=s.relationships[n];if(r.favor<15){note(n+'婉拒了邀約');home(`${n}：「抱歉，最近行程比較滿。下次再說吧。」`);return}if(Math.floor(s.minute/60)<9||Math.floor(s.minute/60)>19){home(`${n}目前不方便赴約。`);return}r.favor+=3;s.mood+=5;note(n+'同意未來一起喝咖啡');home(`${n}接受了你的邀請，表示可以再約定時間。`)}
function phone(){navShow();page('📱 手機',`${stats()}<div class="grid">${button('💬 訊息 '+(s.unread?'🔴'+s.unread:''),'messages()')}${button('💳 銀行','bank()')}${button('📅 行事曆','calendar()')}${button('📸 社群','social()')}${button('🛍️ 購物','shop()')}${button('📰 新聞','news()')}${button('📷 相簿','album()')}${button('📧 電子郵件','email()')}</div>`)}function messages(){s.messages.forEach(m=>m.read=true);s.unread=0;page('💬 訊息',`${s.messages.map(m=>`<div class="notice"><b>${esc(m.from)}</b><br>${esc(m.text)}</div>`).join('')}${button('👥 回覆聯絡人','people()')}${button('返回','phone()')}`)}function bank(){page('💳 星川銀行',`<h2>NT$ ${s.money.toLocaleString()}</h2><p>帳戶餘額｜遊戲內虛擬資金</p><h3>最近收支</h3><div class="log">${s.history.filter(x=>x.includes('NT$')).map(x=>`<p>${esc(x)}</p>`).join('')||'尚無收支紀錄'}</div>${button('返回','phone()')}`)}function calendar(){page('📅 行事曆',`<p>${date()}<br>目前時間 ${minutes()}</p><p>每 30 天：房租結算、薪資結算。</p>${button('返回','phone()')}`)}function social(){page('📸 星川動態',`<div class="notice">林知夏 · 今天<br>「早晨的咖啡香是最棒的！」 ☕</div><div class="notice">城市公告<br>「週末市集即將開放。」</div>${button('返回','phone()')}`)}function shop(){page('🛍️ 線上購物',`<p>選擇要購買的生活用品。</p>${button('日用品 NT$200',"onlineBuy(200,'日用品')")}${button('精緻餐點 NT$280',"onlineBuy(280,'精緻餐點')")}${button('返回','phone()')}`)}function onlineBuy(v,item){if(changeMoney(-v,'網購'+item)){advance(5);s.inventory.push(item)}shop()}function news(){page('📰 星川新聞',`<p>星川市政府公布新年度第二性別職場平權宣導計畫。</p>${button('返回','phone()')}`)}function album(){page('📷 相簿',`<p>目前尚無照片。探索更多地方可能解鎖紀念照片。</p>${button('返回','phone()')}`)}function email(){page('📧 電子郵件',`<p>收件匣目前沒有新郵件。</p>${button('返回','phone()')}`)}function status(){navShow();page('📊 詳細狀態',`${stats()}<p>${esc(s.player.name)}｜${s.player.age}歲｜${esc(s.player.gender)}｜${esc(s.player.abo)}<br>${esc(s.player.appearance)}<br>資訊素：${esc(s.player.scent)}<br>目標：${esc(s.player.goal)}</p>${[['健康',s.health],['體力',s.energy],['心情',s.mood],['壓力',s.stress],['技能',s.skill]].map(([n,v])=>`<div>${n} ${v}/100<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,v))}%"></div></div></div>`).join('')}<h3>🎒 物品</h3><p>${s.inventory.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</p><h3>📜 事件紀錄</h3><div class="log">${s.history.map(x=>`<p>${esc(x)}</p>`).join('')}</div>${button('返回','home()')}`)}function saveScreen(){navShow();page('💾 存檔管理',`<p>可下載完整 JSON 存檔，也可保存在目前瀏覽器。建議定期下載備份。</p><div class="grid">${button('⬇️ 下載存檔','downloadSave()',true)}${button('💾 瀏覽器存檔','localSave()')}${button('📂 匯入存檔','loadScreen()')}${button('返回','home()')}</div>`)}function localSave(){localStorage.setItem('abo_life_save',JSON.stringify(s));alert('已儲存在此瀏覽器。')}function downloadSave(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ABO_LIFE_存檔.json';a.click();URL.revokeObjectURL(a.href)}function loadScreen(){page('💾 讀取存檔',`<p>從本機選擇 JSON 存檔，或讀取此瀏覽器的進度。</p><label>匯入 JSON 檔案<input type="file" id="savefile" accept=".json,application/json" onchange="importSave(event)"></label>${button('讀取瀏覽器存檔','loadLocal()')}${button('← 返回主選單','menu()')}`)}function validate(x){return x&&x.player&&typeof x.day==='number'&&typeof x.minute==='number'&&typeof x.money==='number'&&x.relationships&&Array.isArray(x.history)&&Array.isArray(x.messages)}function importSave(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!validate(x))throw Error('缺少必要存檔欄位');s=x;home('已成功恢復遊戲。')}catch(err){alert('無法讀取存檔：'+err.message)}};reader.readAsText(f)}function loadLocal(){let x=localStorage.getItem('abo_life_save');if(!x){alert('尚無瀏覽器存檔');return}try{let y=JSON.parse(x);if(!validate(y))throw Error('資料不完整');s=y;home('已恢復瀏覽器存檔。')}catch(e){alert('讀取失敗：'+e.message)}}try{menu()}catch(error){document.getElementById('app').insertAdjacentHTML('beforeend','<p class=notice>啟動失敗：'+String(error.message).replace(/[<>]/g,'')+'</p>')}
</script></body></html>
